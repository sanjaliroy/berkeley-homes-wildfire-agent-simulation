name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      # The full requirements.txt pulls in sentence-transformers and torch (~2 GB).
      # No test needs them: client.py imports SentenceTransformer lazily, inside
      # _get_embedding_model(). This is the module-level import set the tests need.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic numpy pandas openpyxl pyyaml pytest

      - name: Run tests
        run: pytest tests/ -q

      # Catches truncated or corrupted notebook cells, which have reached the repo
      # before and are invisible to the unit tests.
      - name: Check notebooks parse
        run: |
          python - <<'PY'
          import json, glob, sys
          failures = []
          for path in sorted(glob.glob("notebooks/**/*.ipynb", recursive=True)):
              try:
                  nb = json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: invalid JSON: {exc}")
                  continue
              for i, cell in enumerate(nb.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  source = "".join(cell.get("source", []))
                  # skip shell/magic cells, which are not valid Python
                  if source.lstrip().startswith(("!", "%")):
                      continue
                  try:
                      compile(source, f"{path}:cell{i}", "exec")
                  except SyntaxError as exc:
                      failures.append(f"{path} cell {i}: {exc.msg} (line {exc.lineno})")
              print(f"checked {path}")
          if failures:
              print("\nNotebook check FAILED:")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print("\nAll notebooks parse.")
          PY
